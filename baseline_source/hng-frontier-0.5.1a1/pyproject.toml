[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hng-frontier"
version = "0.7.0rc3"
description = "Evidence-governed episodic memory and control for HDC, LLM, RAG, and tool-using assistants"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.scripts]
hng-eval = "hngfrontier.eval_cli:main"

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
usearch = ["usearch>=2.15"]
providers = ["faiss-cpu>=1.8", "usearch>=2.15"]
dev = ["pytest>=8", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
